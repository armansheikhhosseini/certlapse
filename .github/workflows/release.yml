name: Release

on:
  push:
    tags: ["v*"]          # runs only when you push a tag like v0.1.0

permissions:
  contents: write         # create the GitHub Release and upload the archives
  packages: write         # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history: the changelog lists commits since the last tag
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4     # lets the amd64 runner build arm64 images
      - uses: docker/setup-buildx-action@v4   # the multi-platform builder
      - uses: docker/login-action@v4          # GoReleaser doesn't log in to registries itself
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"        # any GoReleaser 2.x
          args: release --clean   # the real thing: no --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
